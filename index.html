<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bit Paint - editor gráfico no navegador">
  <title>Bit Paint</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/canvas.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">BP</span><h1>Bit Paint</h1></div>
    <nav class="menu-bar" aria-label="Menu do aplicativo">
      <div class="menu-item">
        <button type="button" class="menu-trigger" aria-expanded="false">Arquivo</button>
        <div class="dropdown-menu">
          <button type="button" data-action="new">Novo <kbd>Ctrl+N</kbd></button>
          <button type="button" data-action="open">Abrir <kbd>Ctrl+O</kbd></button>
          <button type="button" data-action="save">Salvar <kbd>Ctrl+S</kbd></button>
          <hr>
          <button type="button" data-action="print">Imprimir <kbd>Ctrl+P</kbd></button>
          <button type="button" data-action="properties">Propriedades</button>
          <hr>
          <button type="button" data-action="about">Sobre o Bit Paint</button>
          <button type="button" data-action="exit">Sair</button>
        </div>
      </div>
      <div class="menu-item">
        <button type="button" class="menu-trigger" aria-expanded="false">Editar</button>
        <div class="dropdown-menu">
          <button type="button" data-action="undo">Desfazer <kbd>Ctrl+Z</kbd></button>
          <button type="button" data-action="redo">Refazer <kbd>Ctrl+Y</kbd></button>
          <hr>
          <button type="button" data-action="copy">Copiar <kbd>Ctrl+C</kbd></button>
          <button type="button" data-action="paste">Colar <kbd>Ctrl+V</kbd></button>
          <button type="button" data-action="delete">Excluir <kbd>Delete</kbd></button>
          <button type="button" data-action="select-all">Selecionar tudo <kbd>Ctrl+A</kbd></button>
        </div>
      </div>
      <div class="menu-item">
        <button type="button" class="menu-trigger" aria-expanded="false">Exibir</button>
        <div class="dropdown-menu">
          <button type="button" data-action="zoom-in">Ampliar</button>
          <button type="button" data-action="zoom-out">Reduzir</button>
          <button type="button" data-action="zoom-reset">100%</button>
          <hr>
          <button type="button" data-action="fit">Ajustar à janela</button>
          <button type="button" data-action="toggle-grid">Mostrar grade</button>
        </div>
      </div>
      <div class="menu-item">
        <button type="button" class="menu-trigger" aria-expanded="false">Imagem</button>
        <div class="dropdown-menu">
          <button type="button" data-action="flip-h">Virar horizontalmente</button>
          <button type="button" data-action="flip-v">Virar verticalmente</button>
          <button type="button" data-action="rotate">Girar 90°</button>
          <hr>
          <button type="button" data-action="resize">Redimensionar</button>
          <button type="button" data-action="crop">Cortar para seleção</button>
          <hr>
          <button type="button" data-action="grayscale">Escala de cinza</button>
          <button type="button" data-action="invert-colors">Inverter cores</button>
          <button type="button" data-action="sepia">Sépia</button>
          <button type="button" data-action="brightness">Brilho</button>
          <button type="button" data-action="contrast">Contraste</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="app-shell">
    <aside class="toolbar" aria-label="Barra de ferramentas">
      <section class="tool-section">
        <h2>Área de transferência</h2>
        <div class="icon-group clipboard-group">
          <button class="ribbon-action" type="button" data-action="paste" title="Colar" aria-label="Colar"><span>📋</span></button>
          <button class="ribbon-action" type="button" data-action="cut" title="Recortar" aria-label="Recortar"><span>✂</span></button>
          <button class="ribbon-action" type="button" data-action="copy" title="Copiar" aria-label="Copiar"><span>▣</span></button>
        </div>
      </section>
      <section class="tool-section">
        <h2>Imagem</h2>
        <div class="icon-group image-group">
          <button class="ribbon-action" type="button" data-tool="select" title="Selecionar" aria-label="Selecionar"><span>▧</span></button>
          <button class="ribbon-action" type="button" data-action="select-all" title="Selecionar tudo" aria-label="Selecionar tudo"><span>▧</span></button>
          <button class="ribbon-action" type="button" data-action="crop" title="Cortar para seleção" aria-label="Cortar para seleção"><span>⌗</span></button>
          <button class="ribbon-action" type="button" data-action="resize" title="Redimensionar" aria-label="Redimensionar"><span>↔</span></button>
          <button class="ribbon-action" type="button" data-action="rotate" title="Girar" aria-label="Girar"><span>↻</span></button>
        </div>
      </section>
      <section class="tool-section">
        <h2>Ferramentas</h2>
        <div class="tool-grid">
          <button class="tool-button is-selected" type="button" data-tool="pencil" aria-pressed="true"><span class="tool-icon pencil-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path class="pencil-body" d="m5 17 10.8-10.8 3 3L8 20H5v-3Z"></path><path class="pencil-tip" d="m5 17 3 3H5v-3Z"></path><path d="m14.5 7.5 3 3"></path></svg></span><span>Lápis</span></button>
          <button class="tool-button" type="button" data-tool="brush" aria-pressed="false"><span class="tool-icon brush-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path class="brush-handle" d="m5 19 8.8-8.8"></path><path class="brush-head" d="m13 4 7 7-3.1 3.1-7-7L13 4Z"></path><path class="brush-bristles" d="m9.9 7.1 7 7"></path><path class="brush-tip" d="M4 20c1.8-.2 3.1-1 4-2.2L6.2 16c-1.2.9-2 2.2-2.2 4Z"></path></svg></span><span>Pincel</span></button>
          <button class="tool-button" type="button" data-tool="eraser" aria-pressed="false"><span class="tool-icon eraser-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path class="eraser-body" d="m4 15 8.8-8.8a2 2 0 0 1 2.8 0l4.2 4.2a2 2 0 0 1 0 2.8L15 18H7l-3-3Z"></path><path class="eraser-band" d="m9 10 5 5"></path><path class="eraser-base" d="M7 18h8"></path></svg></span><span>Borracha</span></button>
          <button class="tool-button" type="button" data-tool="fill" aria-pressed="false"><span class="tool-icon paint-bucket-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path class="bucket-handle" d="M7 8.2V6.8a5 5 0 0 1 10 0v1.4"></path><path class="bucket-body" d="M4.5 8h15l-1.8 11h-11L4.5 8Z"></path><ellipse class="bucket-rim" cx="12" cy="8" rx="7.5" ry="2"></ellipse><path class="paint-drop" d="M18.5 14.5c0-1.4 1.5-2.5 1.5-3.8 1.1 1.1 2 2.3 2 3.8a2 2 0 0 1-3.5 1.3"></path></svg></span><span>Preencher</span></button>
          <button class="tool-button" type="button" data-tool="picker" aria-pressed="false"><span class="tool-icon picker-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path class="picker-body" d="m8 5 11 11-3 3L5 8l3-3Z"></path><path class="picker-drop" d="M5 18c0-1.4 1.5-2.5 1.5-3.8 1.1 1.1 2 2.3 2 3.8a1.75 1.75 0 0 1-3.5 0Z"></path><path d="m6 18-2 2"></path></svg></span><span>Conta-gotas</span></button>
          <button class="tool-button" type="button" data-tool="text" aria-pressed="false"><span>T</span><span>Texto</span></button>
          <button class="tool-button" type="button" data-tool="magnifier" aria-pressed="false"><span class="tool-icon magnifier-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path><path d="M10.5 7.5v6M7.5 10.5h6"></path></svg></span><span>Lupa</span></button>
        </div>
      </section>
      <section class="tool-section">
        <h2>Formas</h2>
        <div class="tool-grid shape-grid">
          <button class="tool-button" type="button" data-tool="line" aria-pressed="false"><span>╱</span><span>Linha</span></button>
          <button class="tool-button" type="button" data-tool="rectangle" aria-pressed="false"><span>□</span><span>Retângulo</span></button>
          <button class="tool-button" type="button" data-tool="round-rectangle" aria-pressed="false"><span>▢</span><span>Arredondado</span></button>
          <button class="tool-button" type="button" data-tool="ellipse" aria-pressed="false"><span>○</span><span>Elipse</span></button>
          <button class="tool-button" type="button" data-tool="triangle" aria-pressed="false"><span>△</span><span>Triângulo</span></button>
          <button class="tool-button" type="button" data-tool="diamond" aria-pressed="false"><span>◇</span><span>Losango</span></button>
          <button class="tool-button" type="button" data-tool="star" aria-pressed="false"><span>☆</span><span>Estrela</span></button>
          <button class="tool-button" type="button" data-tool="arrow" aria-pressed="false"><span>➜</span><span>Seta</span></button>
          <button class="tool-button" type="button" data-tool="speech" aria-pressed="false"><span>▢</span><span>Balão</span></button>
          <button class="tool-button" type="button" data-tool="pentagon" aria-pressed="false"><span>⬠</span><span>Pentágono</span></button>
          <button class="tool-button" type="button" data-tool="hexagon" aria-pressed="false"><span>⬡</span><span>Hexágono</span></button>
          <button class="tool-button" type="button" data-tool="parallelogram" aria-pressed="false"><span>▱</span><span>Paralelogramo</span></button>
          <button class="tool-button" type="button" data-tool="trapezoid" aria-pressed="false"><span>⏢</span><span>Trapézio</span></button>
          <button class="tool-button" type="button" data-tool="right-triangle" aria-pressed="false"><span>◢</span><span>Triângulo retângulo</span></button>
          <button class="tool-button" type="button" data-tool="heart" aria-pressed="false"><span>♡</span><span>Coração</span></button>
          <button class="tool-button" type="button" data-tool="cloud" aria-pressed="false"><span>☁</span><span>Nuvem</span></button>
          <button class="tool-button" type="button" data-tool="lightning" aria-pressed="false"><span>ϟ</span><span>Relâmpago</span></button>
          <button class="tool-button" type="button" data-tool="cylinder" aria-pressed="false"><span>▱</span><span>Cilindro</span></button>
        </div>
      </section>
      <section class="tool-section size-section">
        <h2>Tamanho</h2>
        <label class="field-label" for="brush-type">Traço</label>
        <select id="brush-type">
          <option value="pencil">Lápis</option>
          <option value="brush">Pincel</option>
          <option value="spray">Spray</option>
          <option value="marker">Marcador</option>
          <option value="crayon">Giz de cera</option>
          <option value="oil">Pincel a óleo</option>
          <option value="watercolor">Pincel de aquarela</option>
          <option value="natural">Pincel natural</option>
          <option value="calligraphy">Pincel de caligrafia</option>
        </select>
        <label class="size-control" for="brush-size"><input id="brush-size" type="range" min="1" max="60" value="4"><output id="brush-size-value">4 px</output></label>
        <label class="check-control"><input id="shape-fill" type="checkbox"> Preenchido</label>
      </section>
      <section class="tool-section text-section">
        <h2>Texto</h2>
        <label class="field-label" for="font-family">Fonte</label>
        <select id="font-family"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Courier New</option></select>
        <label class="field-label" for="font-size">Tamanho</label>
        <input id="font-size" type="number" min="8" max="300" value="32">
        <label class="check-control"><input id="font-bold" type="checkbox"> Negrito</label>
        <label class="check-control"><input id="font-italic" type="checkbox"> Itálico</label>
      </section>
      <section class="tool-section color-section">
        <h2>Cores</h2>
        <div class="color-preview" aria-label="Selected colors"><span id="secondary-color-preview" class="color-swatch color-swatch-secondary"></span><span id="primary-color-preview" class="color-swatch color-swatch-primary"></span></div>
        <button class="swap-button" type="button" data-action="swap-colors">Trocar cores</button>
        <label class="color-picker-label" for="primary-color">Cor principal</label>
        <input id="primary-color" class="color-picker" type="color" value="#1f2937">
        <div id="palette" class="palette" aria-label="Color palette"></div>
      </section>
    </aside>

    <section class="workspace" aria-label="Canvas workspace">
      <div class="canvas-frame"><canvas id="paint-canvas" width="1000" height="700" aria-label="Drawing canvas"></canvas><canvas id="grid-overlay" width="1000" height="700" aria-hidden="true"></canvas><canvas id="selection-overlay" width="1000" height="700" aria-hidden="true"></canvas><div id="canvas-resize-preview" aria-hidden="true"><span></span></div><div id="canvas-resize-top-left" class="canvas-resize-handle canvas-resize-top-left" title="Redimensionar área de trabalho" aria-label="Redimensionar área de trabalho" role="separator"></div><div id="canvas-resize-top" class="canvas-resize-handle canvas-resize-top" title="Redimensionar altura" aria-label="Redimensionar altura" role="separator"></div><div id="canvas-resize-top-right" class="canvas-resize-handle canvas-resize-top-right" title="Redimensionar área de trabalho" aria-label="Redimensionar área de trabalho" role="separator"></div><div id="canvas-resize-right" class="canvas-resize-handle canvas-resize-right" title="Redimensionar largura" aria-label="Redimensionar largura" role="separator"></div><div id="canvas-resize-bottom-right" class="canvas-resize-handle canvas-resize-bottom-right" title="Redimensionar área de trabalho" aria-label="Redimensionar área de trabalho" role="separator"></div><div id="canvas-resize-bottom" class="canvas-resize-handle canvas-resize-bottom" title="Redimensionar altura" aria-label="Redimensionar altura" role="separator"></div><div id="canvas-resize-bottom-left" class="canvas-resize-handle canvas-resize-bottom-left" title="Redimensionar área de trabalho" aria-label="Redimensionar área de trabalho" role="separator"></div><div id="canvas-resize-left" class="canvas-resize-handle canvas-resize-left" title="Redimensionar largura" aria-label="Redimensionar largura" role="separator"></div><div id="text-editor" class="text-editor" hidden><div class="text-editor-grip" title="Arrastar caixa de texto">Texto <span>↕</span></div><textarea aria-label="Texto a inserir" rows="2"></textarea><div class="text-editor-actions"><button type="button" data-text-action="confirm">Aplicar</button><button type="button" data-text-action="cancel">Cancelar</button></div><span class="text-editor-resize" title="Redimensionar caixa de texto" aria-hidden="true"></span></div></div>
    </section>
  </main>

  <footer class="status-bar">
    <span>Imagem: <strong id="canvas-size">1000 × 700</strong></span><span>Ferramenta: <strong id="current-tool">Lápis</strong></span>
    <span>Tamanho: <strong id="current-size">4 px</strong></span><span>Zoom: <strong id="zoom-value">100%</strong></span>
    <span class="status-coordinates">Cursor: <strong id="cursor-position">—</strong></span>
  </footer>

  <dialog id="save-dialog" class="app-dialog">
    <form method="dialog" id="save-form">
      <h2>Salvar imagem</h2>
      <label for="save-name">Nome do arquivo</label>
      <input id="save-name" type="text" value="bit-paint" maxlength="120" autocomplete="off">
      <label for="save-format">Formato</label>
      <select id="save-format">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WebP</option>
      </select>
      <div class="dialog-actions">
        <button type="button" value="cancel" data-dialog-cancel>Cancelar</button>
        <button type="submit" value="save" class="primary-button">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="app-dialog" class="app-dialog">
    <form method="dialog" id="app-dialog-form">
      <h2 id="app-dialog-title"></h2>
      <p id="app-dialog-message"></p>
      <div id="app-dialog-fields"></div>
      <div class="dialog-actions">
        <button type="button" data-app-dialog-cancel>Cancelar</button>
        <button type="submit" value="confirm" class="primary-button" id="app-dialog-confirm">Confirmar</button>
      </div>
    </form>
  </dialog>

  <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
